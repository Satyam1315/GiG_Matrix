<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Create Account - Your Platform</title>
  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
  <style>
    .alert {
      padding: 15px;
      margin-bottom: 20px;
      border: 1px solid transparent;
      border-radius: 4px;
      position: fixed;
      top: 20px;
      right: 20px;
      z-index: 1000;
      animation: fadeIn 0.5s, fadeOut 0.5s 2.5s;
    }
    .alert-error {
      color: #721c24;
      background-color: #f8d7da;
      border-color: #f5c6cb;
    }
    @keyframes fadeIn {
      from {opacity: 0; transform: translateY(-20px);}
      to {opacity: 1; transform: translateY(0);}
    }
    @keyframes fadeOut {
      from {opacity: 1;}
      to {opacity: 0;}
    }
  </style>
</head>
<body>
  <div class="auth-page">
    <div class="form-container">
      <h1>Create Account</h1>
      <p class="subtitle">Join our community today</p>
      
      <form action="signup.php" method="POST">
        <div class="form-group">
          <label for="username">Full Name</label>
          <input type="text" id="username" name="username" class="form-control" placeholder="Enter your full name" required>
        </div>

        <div class="form-group">
          <label for="email">Email Address</label>
          <input type="email" id="email" name="email" class="form-control" placeholder="Enter your email" required>
        </div>
        
        <div class="form-group">
          <label for="password">Password</label>
          <div class="password-field">
            <input type="password" id="password" name="password" class="form-control" placeholder="Create a password" required>
            <span class="password-toggle">
              <i class="far fa-eye"></i>
            </span>
          </div>
        </div>

        <div class="form-group">
          <label for="confirm-password">Confirm Password</label>
          <div class="password-field">
            <input type="password" id="confirm-password" name="confirm-password" class="form-control" placeholder="Confirm your password" required>
            <i class="fas fa-eye password-toggle"></i>
          </div>
        </div>

        <div class="form-group">
          <label>Select Your Role</label>
          <div class="role-selection">
            <label class="role-option">
              <input type="radio" name="role" value="developer" required>
              <span class="role-label">
                <i class="fas fa-code"></i>
                Developer
              </span>
            </label>
            <label class="role-option">
              <input type="radio" name="role" value="freelancer" required>
              <span class="role-label">
                <i class="fas fa-user-tie"></i>
                Freelancer
              </span>
            </label>
          </div>
        </div>
        
        <button type="submit" class="btn-submit">Create Account</button>
      </form>
      
      <div class="form-footer">
        <p>Already have an account? <a href="login.html">Sign in</a></p>
      </div>
    </div>
  </div>

  <div class="alert" id="alert"></div>

  <script>
    // Toggle password visibility
    document.querySelectorAll('.password-toggle').forEach(toggle => {
      toggle.addEventListener('click', function() {
        const passwordInput = this.previousElementSibling;
        const icon = this.querySelector('i');
        
        if (passwordInput.type === 'password') {
          passwordInput.type = 'text';
          icon.classList.remove('fa-eye');
          icon.classList.add('fa-eye-slash');
        } else {
          passwordInput.type = 'password';
          icon.classList.remove('fa-eye-slash');
          icon.classList.add('fa-eye');
        }
      });
    });

    document.addEventListener('DOMContentLoaded', function() {
      const urlParams = new URLSearchParams(window.location.search);
      const error = urlParams.get('error');
      const alert = document.getElementById('alert');
      
      if (error) {
        let message = '';
        switch(error) {
          case 'email_exists':
            message = 'Email already exists. Please use a different email or login.';
            break;
          case 'registration_failed':
            message = 'Registration failed. Please try again.';
            break;
        }
        
        if (message) {
          alert.textContent = message;
          alert.classList.add('alert-error');
          alert.style.display = 'block';
          
          setTimeout(function() {
            alert.style.opacity = '0';
            setTimeout(function() {
              alert.style.display = 'none';
            }, 500);
          }, 2500);
        }
      }
    });
  </script>
</body>
</html>
